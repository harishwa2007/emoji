<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animated Emoji</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #ffeecf;
        margin: 0;
        font-family: Arial;
    }

    .emoji {
        width: 200px;
        height: 200px;
        background: yellow;
        border-radius: 50%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: laugh 1.5s infinite;
    }
    .eye {
        width: 25px;
        height: 35px;
        background: #000;
        border-radius: 50%;
        position: absolute;
        top: 60px;
        animation: blink 3s infinite;
    }

    .eye.left {
        left: 55px;
    }

    .eye.right {
        right: 55px;
    }

    .mouth {
        width: 120px;
        height: 60px;
        background: #000;
        border-bottom-left-radius: 60px;
        border-bottom-right-radius: 60px;
        position: absolute;
        bottom: 40px;
        animation: laughMouth 1.5s infinite;
    }
    @keyframes blink {
        0%, 95% {
            height: 35px;
        }
        96%, 100% {
            height: 5px;
        }
    }
    @keyframes laughMouth {
        0%, 50%, 100% {
            height: 60px;
        }
        25%, 75% {
            height: 30px;
        }
    }

</style>
</head>
<body>

<div class="emoji">
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="mouth"></div>
</div>

</body>
</html>
